[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "awkward-monetizer"
dynamic = ["version"]
description = "Hybrid HEP analysis engine: Awkward Array + MonetDB + Apache Arrow"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "Ianna Osborne" }]
keywords = ["hep", "awkward", "monetdb", "uproot", "columnar", "scikit-hep"]
dependencies = [
    "awkward>=2",
    "uproot>=5",
    "numpy>=1.24",
    "pandas>=2",
    "pyarrow>=12",
    "vector>=1",
    "pymonetdb>=1.7",
]

[project.optional-dependencies]
notebook = ["marimo", "matplotlib", "mplhep", "hist"]
embedded = ["monetdbe"]              # in-process MonetDB (Python <= 3.10 wheels)
dev = ["pytest>=7", "ruff", "pre-commit"]

[project.scripts]
awkward-monetizer = "awkward_monetizer.cli:main"

[project.urls]
Homepage = "https://github.com/ianna/awkward-monetizer"
Issues = "https://github.com/ianna/awkward-monetizer/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/awkward_monetizer"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE"]

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]     # isort, pyupgrade, bugbear

[tool.ruff.lint.per-file-ignores]
# Marimo uses cell return statements and bare expressions for reactive outputs.
"marimo/*.py" = ["PLR1711", "B018"]
"examples/analysis.py" = ["PLR1711", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
