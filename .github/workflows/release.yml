name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test tools
        run: python -m pip install --upgrade build twine pytest ruff

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl
          ruff check .
          pytest
          awkward-monetizer --help
          python -c "from awkward_monetizer.db import read_schema; assert read_schema('dimuon')"

      - name: Check built version matches release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          built = version("awkward-monetizer")
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{built}":
              raise SystemExit(f"Tag {tag} does not match built version {built}")
          print(f"Verified {tag}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/awkward-monetizer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
